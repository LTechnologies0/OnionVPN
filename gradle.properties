# JVM — sized for GitHub-hosted ubuntu-latest (~7 GiB) and local 8+ GiB machines.
# ParallelGC + larger metaspace cuts kotlinc/KSP GC pauses on multi-module Android builds.
org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Execution
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
# Cap workers so CI runners do not thrash under memory pressure (4 vCPU typical).
org.gradle.workers.max=4

# Configuration cache: warn-only so unsupported plugins do not fail the build.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.configuration-cache.max-problems=50

# Kotlin / KSP — keep compilers warm across modules in one Gradle invocation.
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.compiler.execution.strategy=daemon
ksp.incremental=true
ksp.incremental.log=false

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.newDsl=false
android.disallowKotlinSourceSets=false
