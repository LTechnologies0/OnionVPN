# Dependabot covers Maven/Gradle (e.g. arti-mobile) and GitHub Actions only.
#
# It CANNOT watch:
#   - https://gitlab.torproject.org/tpo/core/tor  (no GitLab ecosystem)
#   - GitHub Release .so assets (libtor / Lyrebird / Conjure)
#
# Those are handled by .github/workflows/update-tor-natives.yml using pins in
# gradle/native-versions.properties (tor.release.tag + tor.upstream.tag).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
      include: scope
    groups:
      gradle-all:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions-all:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - ci/cd
