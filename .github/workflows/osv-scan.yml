# Optional OSV dependency scan (complements Dependabot + update-tor-natives.yml).
name: OSV dependency scan

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "gradle/libs.versions.toml"
      - "gradle/native-versions.properties"
      - "**/build.gradle.kts"
      - ".github/workflows/osv-scan.yml"

permissions:
  contents: read
  security-events: write

jobs:
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./
        # Soft until dependency graph noise is tuned; still surfaces findings in the job log.
        continue-on-error: true
