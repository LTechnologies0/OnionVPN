name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Prefer the Gradle Daemon across steps in this job (faster than --no-daemon).
  # setup-gradle caches ~/.gradle between runs (see GitHub Actions + Gradle docs).
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=true
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dkotlin.compiler.execution.strategy=daemon

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle user home (deps, wrappers, build-cache) between workflow runs.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          add-job-summary: always

      - uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" >> local.properties

      - name: Ensure native binaries
        run: |
          chmod +x scripts/fetch-native-binaries.sh
          if [ ! -f app/src/main/jniLibs/arm64-v8a/libtor.so ]; then
            ./scripts/fetch-native-binaries.sh
          fi

      # Instrument before the only compile pass so CodeQL sees kotlinc/javac
      # without a second clean --rerun-tasks rebuild.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Test and assemble debug (arm64-v8a)
        run: >
          ./gradlew test :app:assembleDebug
          -Ponionphone.devAbi=arm64-v8a
          -x lint
          --stacktrace
          --build-cache

      - name: Native .so strings denylist
        run: |
          set -euo pipefail
          # High-confidence leaked material only. Do NOT match bare secret_key /
          # api_key — Tor, Arti, DNSCrypt, and PTs embed those as crypto API names
          # (ed25519_secret_key_*, SecretKey, TLS "master secret", …).
          DENY='(-----BEGIN ([A-Z0-9]+ )?PRIVATE KEY-----|AKIA[0-9A-Z]{16})'
          found=0
          while IFS= read -r so; do
            size=$(stat -c%s "$so" 2>/dev/null || stat -f%z "$so")
            if [ "$size" -gt 52428800 ]; then
              echo "::warning::$so is >50MB — track with Git LFS (see docs/TUN_DATA_PLANE.md)"
            fi
            if command -v strings >/dev/null 2>&1; then
              hits=$(strings -n 8 "$so" | grep -Ei "$DENY" || true)
              if [ -n "$hits" ]; then
                echo "::error::Suspicious strings in $so"
                printf '%s\n' "$hits" | head -20
                found=1
              fi
            fi
          done < <(find app/src/main/jniLibs -name '*.so' -type f 2>/dev/null || true)
          exit "$found"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: onionvpn-debug-arm64-v8a
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Soft-fail until Dependency graph is enabled:
    # Settings → Code security → Dependency graph
    # (action errors with "Dependency review is not supported" otherwise).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
