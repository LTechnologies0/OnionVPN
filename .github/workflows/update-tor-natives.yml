# Tor natives updater — Dependabot cannot watch GitLab or GitHub Release .so files.
#
# 1) Our built binaries: LTechnologies0/Tor-Android-build-script releases → jniLibs
# 2) Upstream little-t: https://gitlab.torproject.org/tpo/core/tor tags → tor.upstream.tag
name: Update Tor natives

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tor-Android-build-script release tag (empty = latest tor-*)"
        required: false
        default: ""
      check_upstream_only:
        description: "Only check tpo/core/tor GitLab tags (no binary fetch)"
        type: boolean
        default: false
  repository_dispatch:
    types: [tor-natives-release]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: update-tor-natives
  cancel-in-progress: true

jobs:
  upstream-gitlab:
    runs-on: ubuntu-latest
    outputs:
      upstream_new: ${{ steps.cmp.outputs.changed }}
      upstream_tag: ${{ steps.cmp.outputs.new }}
      upstream_pin: ${{ steps.cmp.outputs.pin }}
    steps:
      - uses: actions/checkout@v7

      - name: Latest stable tag from tpo/core/tor
        id: gl
        run: |
          set -euo pipefail
          PROJECT=$(grep -E '^tor\.upstream\.project=' gradle/native-versions.properties | cut -d= -f2- | tr -d '[:space:]')
          PROJECT="${PROJECT:-tpo/core/tor}"
          export PROJECT
          TAG=$(python3 <<'PY'
          import json, os, re, urllib.parse, urllib.request

          project = os.environ["PROJECT"]
          enc = urllib.parse.quote(project, safe="")
          req = urllib.request.Request(
              f"https://gitlab.torproject.org/api/v4/projects/{enc}/repository/tags?per_page=30",
              headers={"User-Agent": "onionvpn-tor-natives"},
          )
          with urllib.request.urlopen(req) as r:
              tags = json.load(r)
          pat = re.compile(r"^tor-0\.4\.9\.\d+$")
          for t in tags:
              if pat.match(t["name"]):
                  print(t["name"])
                  break
          else:
              for t in tags:
                  n = t["name"]
                  if n.startswith("tor-") and "alpha" not in n and "dev" not in n and "rc" not in n:
                      print(n)
                      break
          PY
          )
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "GitLab $PROJECT latest stable-ish: $TAG"

      - name: Compare tor.upstream.tag pin
        id: cmp
        run: |
          set -euo pipefail
          PIN=$(grep -E '^tor\.upstream\.tag=' gradle/native-versions.properties | cut -d= -f2- | tr -d '[:space:]')
          NEW="${{ steps.gl.outputs.tag }}"
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$PIN" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: PR — bump upstream pin
        if: steps.cmp.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEW="${{ steps.cmp.outputs.new }}"
          PIN="${{ steps.cmp.outputs.pin }}"
          BRANCH="deps/tor-upstream-${NEW}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          sed -i "s/^tor\\.upstream\\.tag=.*/tor.upstream.tag=${NEW}/" gradle/native-versions.properties
          git add gradle/native-versions.properties
          git commit -m "build(tor): track upstream ${NEW} from tpo/core/tor"
          git push -u origin "$BRANCH" --force
          if ! gh pr list --head "$BRANCH" --json number -q '.[0].number' | grep -q '[0-9]'; then
            gh pr create \
              --title "build(tor): upstream tpo/core/tor ${NEW}" \
              --body "tpo/core/tor has ${NEW} (was ${PIN}). Rebuild Tor-Android-build-script, then refresh OnionVPN natives."
          fi

  bump-binaries:
    if: ${{ github.event.inputs.check_upstream_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Tor-Android-build-script release
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO=LTechnologies0/Tor-Android-build-script
          INPUT="${{ github.event.inputs.tag }}"
          if [ -z "$INPUT" ] && [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            INPUT="${{ github.event.client_payload.tag }}"
          fi
          if [ -n "$INPUT" ]; then
            TAG="$INPUT"
          else
            TAG=$(gh release list --repo "$REPO" --limit 20 --json tagName \
              --jq '[.[] | select(.tagName|test("^tor-"))][0].tagName // empty')
            if [ -z "$TAG" ]; then
              TAG=$(gh release view --repo "$REPO" --json tagName -q .tagName)
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name' | grep -q 'libtor-arm64-v8a.so'

      - name: Compare tor.release.tag
        id: cmp
        run: |
          set -euo pipefail
          PIN=$(grep -E '^tor\.release\.tag=' gradle/native-versions.properties | cut -d= -f2- | tr -d '[:space:]')
          NEW="${{ steps.tag.outputs.tag }}"
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"
          if [ "$PIN" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump pin and fetch natives
        if: steps.cmp.outputs.changed == 'true'
        run: |
          set -euo pipefail
          NEW="${{ steps.tag.outputs.tag }}"
          sed -i "s/^tor\\.release\\.tag=.*/tor.release.tag=${NEW}/" gradle/native-versions.properties
          chmod +x scripts/fetch-native-binaries.sh
          rm -f "${TMPDIR:-/tmp}/onionvpn-bin-fetch"/libtor-*.so \
                "${TMPDIR:-/tmp}/onionvpn-bin-fetch"/libLyrebird-*.so \
                "${TMPDIR:-/tmp}/onionvpn-bin-fetch"/libConjure-*.so || true
          REFRESH_HEV=0 TOR_RELEASE_TAG="$NEW" ./scripts/fetch-native-binaries.sh

      - name: Open pull request (binaries)
        if: steps.cmp.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEW="${{ steps.tag.outputs.tag }}"
          PIN="${{ steps.cmp.outputs.pin }}"
          BRANCH="deps/tor-natives-${NEW//+/-}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add gradle/native-versions.properties \
            app/src/main/jniLibs/*/libtor.so \
            app/src/main/jniLibs/*/libLyrebird.so \
            app/src/main/jniLibs/*/libConjure.so \
            app/src/main/assets/pt_bridges.json || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build(natives): bump Tor+PTs to ${NEW}"
          git push -u origin "$BRANCH" --force
          if ! gh pr list --head "$BRANCH" --json number -q '.[0].number' | grep -q '[0-9]'; then
            gh pr create \
              --title "build(natives): Tor+PTs ${NEW}" \
              --body "tor.release.tag ${PIN} → ${NEW}. DNSCrypt stays vendored."
          fi
