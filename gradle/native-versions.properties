# Native binary / upstream pins for OnionVPN.
# Dependabot cannot watch GitLab or GitHub Release .so assets — see
# .github/workflows/update-tor-natives.yml

# Our built libtor/PTs (LTechnologies0/Tor-Android-build-script release tag)
tor.release.tag=tor-0.4.9.11-dev+staticz-20260808b

# Upstream little-t tracking (https://gitlab.torproject.org/tpo/core/tor tags).
# When this drifts ahead of our build script, open a rebuild of Tor-Android-build-script.
tor.upstream.tag=tor-0.4.9.11
tor.upstream.project=tpo/core/tor

# Vendored DNSCrypt-proxy (app/src/main/jniLibs/*/libdnscrypt-proxy.so) — not fetched by
# fetch-native-binaries.sh. Go module / VCS revision embedded in the .so buildinfo.
dnscrypt.repo=https://github.com/DNSCrypt/dnscrypt-proxy.git
dnscrypt.commit=434f38d1e27f1a3dfc9de9e3ba3aea5c647e4290
dnscrypt.ref=v0.0.0-20260530125938-434f38d1e27f

# Floors enforced by scripts/verify-native-cve-pins.sh (must match docs/CVE_INVENTORY.md).
openssl.min=3.6.3
tor.min=0.4.9.11
